# Phase 1 cordis composition for `dsh-desktop`. Trims the headless-agent
# spine to chat-with-tools: LLM (multi-provider), agent loop, persistence,
# session title, fs / bash / todo / skill. Defer workflow / ralph / subagent /
# web search / e2b / acp / lsp to later phases.
#
# The Electron main process sets the child environment before spawn:
#   DSH_HOME              = app.getPath('userData')   (settings + credentials)
#   DSH_SESSIONS_DB_PATH  = app.getPath('userData') + '/sessions.db'
#   DEEPSEEK_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY = the user-supplied
#       per-route key sourced from Electron safeStorage; routes that lack a
#       key simply fail the request with MISSING_CREDENTIAL until set.
#
# `cwd` for the main agent is the user's working directory, supplied by
# Electron's main process as the child-process cwd; `!!js process.cwd()`
# resolves to that value inside the child.

# User-settings document (`$DSH_HOME/settings.yaml`, hot-reloaded): the
# `llm-pi-ai:` section there layers over the composition base.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# Credential store: the live process environment over
# `$DSH_HOME/.credentials.yaml` (owner-only file, hot-reloaded). The LLM
# adapter resolves each route's `apiKeyEnv` through it on every request.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Multi-provider LLM adapter. Three catalog routes ship in the base; users
# add custom OpenAI-compatible routes through the settings panel, which
# writes `llm-pi-ai.providers.<key>` to settings.yaml.
- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        modelOverrides:
          deepseek-v4-pro:
            reasoningEfforts:
              off:
              high: high
      openai:
        apiKeyEnv: OPENAI_API_KEY
        modelOverrides:
          gpt-5:
            reasoningEfforts:
              off:
              high: high
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        modelOverrides:
          claude-sonnet-4-5:
            reasoningEfforts:
              off:
              high: high

# Managed child-process groups for the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 60000

# The default spine; pre-creates one `main` agent driven by Electron-supplied cwd.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek
        model: deepseek-v4-pro
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are dsh-desktop, a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

# Durable session log; path is filled in by the Electron main process.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-sqlite'
  config:
    path: !!js process.env.DSH_SESSIONS_DB_PATH
    journalMode: wal

# Auto-title sessions from the first prompt.
- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80

# Context-window management.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Filesystem tools (writes require an observed file).
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Bash tool.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

# Todo tool.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Skill loading.
- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# Checkpoint policy on `session/flush`.
- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# The JSON-RPC server the Electron main process drives. This is the only
# plugin that owns the wire protocol; without it, the harness boots but
# serves nothing on stdio.
- id: jsonrpc
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
